[tool.ruff]
src = ["backend"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["F811"]  # allow fixture redefinition

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
